apply plugin: 'com.android.application'

/*
 * 签名：调试密钥与发布密钥分开。
 *
 * 背景：之前 release 复用 debug 用的 stable 密钥。自己装测试包没问题，
 * 但上架不行——Play 要求发布密钥唯一且长期保管，
 * 用 debug 密钥上传的包会在后续更新时无法更换密钥。
 *
 * 现在两套配置：
 *   android/keystore.properties          → stable（本地安装、真机测试）
 *   android/release-keystore.properties  → release（上架）
 *
 * 关键安全约束：assembleRelease / bundleRelease 在缺少发布密钥时**直接失败**。
 * 不能静默回退到 debug 签名——那种包传到 Play 会被拒，
 * 更糟的是如果误传成功，这个应用就永久绑定了错误的密钥。
 */
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}
def hasStableKey = keystorePropsFile.exists() && keystoreProps.getProperty('storeFile')

def releasePropsFile = rootProject.file('release-keystore.properties')
def releaseProps = new Properties()
if (releasePropsFile.exists()) {
    releasePropsFile.withInputStream { releaseProps.load(it) }
}
def hasReleaseKey = releasePropsFile.exists() && releaseProps.getProperty('storeFile')

/*
 * 发布构建前置检查。
 *
 * 用 taskGraph 而不是在 buildTypes 里判断，是因为后者只能静默跳过签名，
 * 最终产出一个未签名（或 debug 签名）的 APK，而构建过程显示"成功"。
 */
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        (t.name == 'assembleRelease' || t.name == 'bundleRelease' || t.name == 'assembleReleaseBundle')
    }
    if (wantsRelease && !hasReleaseKey) {
        throw new GradleException(
            '缺少发布签名配置。请在 android/release-keystore.properties 中提供：\n' +
            '  storeFile=release.keystore\n' +
            '  storePassword=...\n' +
            '  keyAlias=...\n' +
            '  keyPassword=...\n' +
            '发布包不能用调试密钥签名，构建已中止。'
        )
    }
}

android {
    namespace "app.lianji.fit"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        /*
         * 安装包 ID 跟随品牌改为 app.lianji.fit（v1.2 起）。
         *
         * 代价：新旧包在系统里是两个应用。已装 v1.1（com.tieguan.fit）的设备
         * **不能覆盖升级**，旧数据也不会自动跟过来。升级路径：
         *   旧版「我的 → 数据与备份 → 导出」→ 装新版 → 导入。
         * 如果需要恢复"直接覆盖升级"，把这里和 capacitor.config.ts 的 appId
         * 一起改回 com.tieguan.fit（签名未变，改回即可覆盖）。
         */
        applicationId "app.lianji.fit"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // 本地安装与真机测试用；换机器也能覆盖升级
        stable {
            if (hasStableKey) {
                storeFile file(keystoreProps.getProperty('storeFile'))
                storePassword keystoreProps.getProperty('storePassword')
                keyAlias keystoreProps.getProperty('keyAlias')
                keyPassword keystoreProps.getProperty('keyPassword')
            }
        }
        // 上架用；密钥不入库，由发布者自行保管
        release {
            if (hasReleaseKey) {
                storeFile file(releaseProps.getProperty('storeFile'))
                storePassword releaseProps.getProperty('storePassword')
                keyAlias releaseProps.getProperty('keyAlias')
                keyPassword releaseProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            if (hasStableKey) {
                signingConfig signingConfigs.stable
            }
        }
        release {
            /*
             * 开启 R8：商业包应该缩体积、去无用代码。
             * 之前是 false，APK 里带着整份未裁剪的 WebView 桥接代码。
             */
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKey) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}


