name: verify

# 门禁目标：让"能构建、能测试、能跑关键路径"成为合并前置条件。
# 之前 273 项测试全靠人工执行，任何提交都可能悄悄破坏主路径。

on:
  # 只在主分支 push 时全量验证。
  # 之前是 branches: ['**']，等于每个临时分支都跑一遍 E2E + Android 出包，
  # 而临时分支提 PR 时会再跑一次，纯浪费。分支保护靠 pull_request 兜住。
  push:
    branches: ['main']
    # 纯文档改动不必占用 CI：docs/**、*.md 变更跳过。
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 静态检查与单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # --ignore-scripts：本项目的依赖无需 postinstall，
      # 且部分环境 postinstall 会因权限失败（见 README 环境说明）
      - run: npm ci --ignore-scripts

      - name: 类型检查（应用）
        run: npm run typecheck

      - name: 类型检查（E2E）
        run: npm run typecheck:e2e

      - name: 单元测试
        run: npm run test

      - name: 构建
        run: npx vite build

  e2e:
    name: 端到端
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci --ignore-scripts

      # CI 用 Playwright 自带 Chromium（本地开发用系统 Edge，两者都支持 channel 覆盖）
      - name: 安装浏览器
        run: npx playwright install --with-deps chromium

      - name: 运行 E2E
        run: npx playwright test
        env:
          CI: '1'
          # 覆盖 playwright.config.ts 里的 channel: 'msedge'
          E2E_CHANNEL: 'chromium'

      - name: 多视口视觉审计
        run: node scripts/visual-audit.mjs
        env:
          CI: '1'

      - name: 上传审计截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-audit
          path: shots/audit/
          retention-days: 7

      - name: 上传失败痕迹
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
  android:
    name: Android 出包
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - run: npm ci --ignore-scripts

      - name: 配置 SDK 路径
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: 编译 APK 并校验
        run: node scripts/build-android.mjs

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7

